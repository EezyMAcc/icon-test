<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Heaven</title>

  <!-- Home-screen icon. iOS rounds the corners itself, so the PNG is a plain opaque square. -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Name under the icon, and full-screen launch from the home screen. -->
  <meta name="apple-mobile-web-app-title" content="Heaven">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#86B8EE">

  <script>
    // Optional: when opened from the home screen, go straight to this address.
    // Leave it empty to show this page instead. Example: "https://example.com"
    const OPEN_URL = "";

    const standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
    if (OPEN_URL && standalone) window.location.replace(OPEN_URL);
  </script>

  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
      color: #13243F;
      background: #BCDAF7 url("sky.jpg") center / cover no-repeat fixed;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      text-align: center;
    }
    main { display: grid; gap: 18px; justify-items: center; max-width: 360px; }
    .icon {
      width: 148px; height: 148px; border-radius: 33px;
      box-shadow: 0 1px 2px rgba(19, 36, 63, .12), 0 18px 40px rgba(40, 80, 150, .28);
    }
    h1 { margin: 6px 0 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
    .how {
      margin-top: 8px; padding: 16px 18px; border-radius: 20px; text-align: left;
      background: rgba(255, 255, 255, .55);
      -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, .7);
      font-size: 15px; line-height: 1.45;
    }
    .how ol { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 6px; }
    .how b { font-weight: 600; }
    .how .lead { font-weight: 600; }
    .is-standalone .how { display: none; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="icon-512.png" alt="Heaven app icon: a pink heart with white wings and a gold halo on a blue sky">
    <h1>Heaven</h1>
    <div class="how">
      <div class="lead">Add it to your home screen</div>
      <ol>
        <li>Open this page in <b>Safari</b> on your iPhone.</li>
        <li>Tap the <b>Share</b> button.</li>
        <li>Choose <b>Add to Home Screen</b>, then <b>Add</b>.</li>
      </ol>
    </div>
  </main>
  <script>
    if (standalone) document.body.classList.add("is-standalone");
  </script>
</body>
</html>
